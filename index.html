<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Auth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      text-align: center;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      background: white;
      color: #3c4043;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .google-btn:hover { background: #f7f8f8; }
    .google-btn img { width: 20px; height: 20px; }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      border: 2px solid #eee;
    }
    .name { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 4px; }
    .email { font-size: 14px; color: #666; margin-bottom: 20px; }

    .logout-btn {
      width: 100%;
      padding: 10px 16px;
      background: #d93025;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .logout-btn:hover { background: #b7271d; }

    .msg { margin-top: 14px; color: #b7271d; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Signed-out view -->
    <div id="signed-out">
      <h3 style="margin-top:0;">Welcome Back</h3>
      <button id="btn-google" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Sign in with Google
      </button>
    </div>

    <!-- Signed-in view -->
    <div id="signed-in" class="hidden">
      <img id="avatar" class="avatar" src="" alt="Avatar">
      <div id="name" class="name"></div>
      <div id="email" class="email"></div>
      <button id="btn-logout" class="logout-btn">Logout</button>
    </div>

    <div id="status" class="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsbCw8uavQ55SuG0M5rfz4HtjqcUYO0Pk",
      authDomain: "pnpmbackend.firebaseapp.com",
      projectId: "pnpmbackend",
      storageBucket: "pnpmbackend.firebasestorage.app",
      messagingSenderId: "801262545637",
      appId: "1:801262545637:web:691ba3e5a6d2691b97420c",
      measurementId: "G-SMQJ5R036Y"
    };

    // FIXED: Render Backend URL yahan set kar di hai
    const API_BASE = "https://pnpm-4cm8.onrender.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const signedOutView = document.getElementById('signed-out');
    const signedInView = document.getElementById('signed-in');
    const statusDiv = document.getElementById('status');
    const avatarImg = document.getElementById('avatar');
    const nameDiv = document.getElementById('name');
    const emailDiv = document.getElementById('email');

    // Mobile detect block
    const isMobile = /Android|iPhone|iPad|iPod|Mobile|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);

    async function syncWithBackend(user) {
      try {
        const idToken = await user.getIdToken();
        const response = await fetch(`${API_BASE}/api/auth/google-sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });
        const data = await response.json();
        
        if (!response.ok) {
          statusDiv.innerText = 'Backend sync failed: ' + data.message;
        } else {
          console.log('MongoDB Saved:', data);
        }
      } catch (error) {
        statusDiv.innerText = 'Server Error: ' + error.message;
      }
    }

    // Sign in with Google
    document.getElementById('btn-google').addEventListener('click', async () => {
      statusDiv.innerText = '';
      try {
        if (isMobile) {
          await signInWithRedirect(auth, provider);
        } else {
          const result = await signInWithPopup(auth, provider);
          await syncWithBackend(result.user);
        }
      } catch (err) {
        statusDiv.innerText = 'Error: ' + err.message;
      }
    });

    // Mobile Redirect flow result
    getRedirectResult(auth)
      .then(async (result) => {
        if (result && result.user) {
          await syncWithBackend(result.user);
        }
      })
      .catch((err) => {
        statusDiv.innerText = 'Error: ' + err.message;
      });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (err) {
        statusDiv.innerText = 'Error: ' + err.message;
      }
    });

    // Auth State Change listener
    onAuthStateChanged(auth, (user) => {
      if (user) {
        avatarImg.src = user.photoURL || 'https://www.gravatar.com/avatar/?d=mp&f=y';
        nameDiv.innerText = user.displayName || 'User';
        emailDiv.innerText = user.email || '';
        signedOutView.classList.add('hidden');
        signedInView.classList.remove('hidden');
      } else {
        signedOutView.classList.remove('hidden');
        signedInView.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
