<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  body{ font-family:Arial, sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f4f4f9; }
  .card{ background:#fff; padding:30px; border-radius:10px; max-width:340px; width:90%; box-shadow:0 2px 8px rgba(0,0,0,0.12); text-align:center; }
  .google-btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px 16px; background:#fff; color:#3c4043; border:1px solid #dadce0; border-radius:6px; font-size:15px; font-weight:500; cursor:pointer; }
  .google-btn:hover{ background:#f7f8f8; }
  .google-btn img{ width:20px; height:20px; }
  .google-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .profile{ display:none; }
  .profile.show{ display:block; }
  .profile img{ width:56px; height:56px; border-radius:50%; margin-bottom:10px; }
  .name{ font-size:18px; font-weight:600; margin-bottom:2px; }
  .email{ font-size:13px; color:#666; margin-bottom:16px; }
  .logout-btn{ width:100%; padding:10px 16px; background:#d93025; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
  .logout-btn:hover{ background:#b7271d; }
  .msg{ margin-top:14px; color:#b7271d; font-size:13px; word-break:break-word; }
</style>
</head>
<body>

  <div class="card">
    <button id="btn-google" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Sign in with Google
    </button>

    <div class="profile" id="profile">
      <img id="photo" src="" alt="">
      <div class="name" id="name"></div>
      <div class="email" id="email"></div>
      <button class="logout-btn" id="btn-logout">Logout</button>
    </div>

    <div class="msg" id="status"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBj98LW5fIuKYANDhnXuDZSFarZIkEc8zE",
    authDomain: "firbase-backend-aebe6.firebaseapp.com",
    projectId: "firbase-backend-aebe6",
    storageBucket: "firbase-backend-aebe6.firebasestorage.app",
    messagingSenderId: "104519463646",
    appId: "1:104519463646:web:1e150ace3c8335e5ae484f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const BACKEND_URL = "https://firebasebackend-4rwv.onrender.com";

  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || window.matchMedia("(max-width: 860px)").matches;

  const btnGoogle = document.getElementById("btn-google");
  const btnLogout = document.getElementById("btn-logout");
  const profileEl = document.getElementById("profile");
  const photoEl = document.getElementById("photo");
  const nameEl = document.getElementById("name");
  const emailEl = document.getElementById("email");
  const statusEl = document.getElementById("status");

  function showProfile(data, fallbackUser){
    photoEl.src = data?.photoURL || fallbackUser?.photoURL || "";
    nameEl.textContent = data?.name || fallbackUser?.displayName || "User";
    emailEl.textContent = data?.email || fallbackUser?.email || "";
    profileEl.classList.add("show");
    btnGoogle.style.display = "none";
  }

  function showSignedOut(){
    profileEl.classList.remove("show");
    btnGoogle.style.display = "flex";
    btnGoogle.disabled = false;
  }

  // Sync the signed-in Firebase user to the backend, then render the
  // profile using whatever the backend returns (falls back to the raw
  // Firebase user object if the backend call fails).
  async function syncWithBackend(user){
    statusEl.textContent = "";
    try {
      const idToken = await user.getIdToken(true);
      const res = await fetch(`${BACKEND_URL}/api/auth/sync`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}` }
      });
      const data = await res.json();
      if (res.ok) {
        showProfile(data.user, user);
      } else {
        statusEl.textContent = data.message || "Backend sync failed.";
        showProfile(null, user); // still show Firebase profile so login isn't lost
      }
    } catch (err) {
      statusEl.textContent = "Couldn't reach backend: " + err.message;
      showProfile(null, user);
    }
  }

  btnGoogle.addEventListener("click", async () => {
    statusEl.textContent = "";
    btnGoogle.disabled = true;
    try {
      if (isMobile) {
        await signInWithRedirect(auth, provider);
      } else {
        const result = await signInWithPopup(auth, provider);
        await syncWithBackend(result.user);
      }
    } catch (err) {
      btnGoogle.disabled = false;
      statusEl.textContent = "Error: " + err.message;
    }
  });

  btnLogout.addEventListener("click", async () => {
    try { await signOut(auth); }
    catch (err) { statusEl.textContent = "Error: " + err.message; }
  });

  // Catch the redirect result (mobile flow) — wrapped so a failure here
  // never silently blocks the page.
  getRedirectResult(auth)
    .then((result) => { if (result && result.user) syncWithBackend(result.user); })
    .catch((err) => {
      statusEl.textContent = "Error: " + err.message;
      btnGoogle.disabled = false;
    });

  onAuthStateChanged(auth, (user) => {
    if (!user) { showSignedOut(); return; }
    // Popup/redirect handlers above already trigger the sync for a fresh
    // sign-in; this just ensures the profile shows on a page reload too.
    if (!profileEl.classList.contains("show")) syncWithBackend(user);
  });
</script>
</body>
</html>
